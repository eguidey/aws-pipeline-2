# Terraform delivered by GitHub Actions - plan on pull requests, apply on main after approval.
#
# Runs independently of pipeline.yml, triggered only by changes that affect infrastructure.
# On a brand-new environment run this workflow first: the app pipeline deploys into the
# ECR repository, ECS service and roles this one creates.
#
# Every plan passes through the preventive policy gate (policy/check.py) before it can be
# applied - the AWS counterpart of Azure Policy's "deny" effect.
name: Infrastructure

on:
  pull_request:
    paths:
      - infra/**
      - policy/**
      - detections/** # saved queries are deployed by Terraform
      - lambda/** # the responder is packaged by Terraform
      - .github/workflows/infra.yml
  push:
    branches: [main]
    paths:
      - infra/**
      - policy/**
      - detections/**
      - lambda/**
      - .github/workflows/infra.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-prod # never run two plans/applies against the same state at once
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_KEY: aws-pipeline-2/prod.tfstate

jobs:
  # ---------------------------------------------------------------- pull requests: plan only
  plan:
    name: Plan & policy gate
    # Fork PRs never get AWS credentials (GitHub withholds OIDC tokens from them anyway).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.TF_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Write settings from the TFVARS_PROD secret
        env:
          TFVARS: ${{ secrets.TFVARS_PROD }}
        run: |
          if [ -z "$TFVARS" ]; then echo "::error::Add the TFVARS_PROD repository secret (contents of environments/prod.tfvars)"; exit 1; fi
          printf '%s\n' "$TFVARS" > environments/prod.tfvars

      - name: Terraform init (remote state, native locking)
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        run: |
          terraform plan -var-file=environments/prod.tfvars -lock-timeout=5m -out=tfplan
          terraform show -json tfplan > plan.json
          { echo "### Terraform plan"; terraform show -no-color tfplan | grep -E '^(Plan:|No changes)' || true; } >> "$GITHUB_STEP_SUMMARY"

      - name: Policy gate - block non-compliant infrastructure
        working-directory: .
        run: python3 -m policy.check plan infra/plan.json

  # ---------------------------------------------------------------- main: plan, gate, apply
  apply:
    name: Plan, policy gate & apply
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.TF_APPLY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # Protect this environment: required reviewers + deployment branch rule "main" only.
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Write settings from the TFVARS_PROD secret
        env:
          TFVARS: ${{ secrets.TFVARS_PROD }}
        run: |
          if [ -z "$TFVARS" ]; then echo "::error::Add the TFVARS_PROD repository secret (contents of environments/prod.tfvars)"; exit 1; fi
          printf '%s\n' "$TFVARS" > environments/prod.tfvars

      - name: Terraform init (remote state, native locking)
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -var-file=environments/prod.tfvars -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -json tfplan > plan.json
          { echo "### Terraform plan"; terraform show -no-color tfplan | grep -E '^(Plan:|No changes)' || true; } >> "$GITHUB_STEP_SUMMARY"

      - name: Policy gate - block non-compliant infrastructure
        working-directory: .
        run: python3 -m policy.check plan infra/plan.json

      - name: Terraform apply (exactly the plan that passed the gate)
        if: steps.plan.outputs.changes == 'true'
        run: terraform apply -lock-timeout=5m tfplan
